services:
  postgres:
    image: postgres:16.2
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - internal

  backend:
    build: .
    container_name: backend
    env_file:
    - .env
    depends_on:
    - postgres
    ports:
    - "${BACKEND_PORT}:8000"
    networks:
    - internal

volumes:
  postgres_data:

networks:
  internal: