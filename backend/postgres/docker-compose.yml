services:
  postgres:
    image: postgres:16.2
    container_name: postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"  # solo local

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
